# Aplicaciones (microservicios + frontend).
# Usar junto con docker-compose.base.yml (define red, brokers y PostgreSQL):
#   docker compose -f infra/docker-compose.base.yml -f infra/docker-compose.apps.yml up -d
#
# Seguridad JWT (perfil Spring "secure") combinada con prod:
#   SPRING_PROFILES_ACTIVE=prod,secure AZURE_TENANT_ID=<tenant> AZURE_CLIENT_ID=<client> \
#     docker compose -f infra/docker-compose.base.yml -f infra/docker-compose.apps.yml up -d --build

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-rutaexpress}
  DB_PASS: ${POSTGRES_PASSWORD:-rutaexpress}

services:
  shipments:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-shipments
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: shipments
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rutaexpress}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rutaexpress}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  catalog:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-catalog
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: catalog
    ports:
      - "8082:8082"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy

  notify:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-notify
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: notify
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rutaexpress}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rutaexpress}
    ports:
      - "8083:8083"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  report:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-report
    environment:
      <<: *spring-env
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - rutaexpress-net
    depends_on:
      kafka:
        condition: service_healthy

  audit:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-audit
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: audit
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8085:8085"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bff:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        MODULE: ms-rutaexpress-bff
    environment:
      <<: *spring-env
      SHIPMENTS_URL: http://shipments:8081
      CATALOG_URL: http://catalog:8082
      NOTIFY_URL: http://notify:8083
      REPORT_URL: http://report:8084
      AUDIT_URL: http://audit:8085
    ports:
      - "8080:8080"
    networks:
      - rutaexpress-net

  frontend:
    build:
      context: ../frontend
      args:
        VITE_BFF_URL: ${VITE_BFF_URL:-/api/bff}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
        VITE_AZURE_API_SCOPE: ${AZURE_API_SCOPE:-api://rutaexpress/access_as_user}
    ports:
      - "3000:80"
    networks:
      - rutaexpress-net
    depends_on:
      - bff

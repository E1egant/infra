# Aplicaciones (microservicios + frontend) desde repos hermanos.
# Layout esperado (ver Cloud-Native-1/REPOS.md):
#   Cloudnative/
#     Cloud-Native-1/  ms-rutaexpress-*/  frontend-rutaexpress/  infra/
# Uso (desde infra/):
#   docker compose -f docker-compose.base.yml -f docker-compose.apps.yml up -d --build
#
# Los servicios propios (catalog, audit, report) usan su Dockerfile;
# los de Diego se construyen con los Dockerfiles genéricos de docker/
# (cuando agregue los suyos, se cambia a `context: ../<repo>`).
#
# Perfiles: por defecto `prod` (PostgreSQL, sin JWT) para desarrollo local.
# Despliegue: SPRING_PROFILES_ACTIVE=prod,secure con AZURE_TENANT_ID y
# AZURE_API_AUDIENCE (ver ec2/deploy.sh).

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-rutaexpress}
  DB_PASS: ${POSTGRES_PASSWORD:-rutaexpress}

services:
  shipments:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.jvm
      args:
        MODULE_DIR: ms-rutaexpress-shipments
        JAVA_VERSION: "17"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: shipments
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rutaexpress}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rutaexpress}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  catalog:
    build:
      context: ../ms-rutaexpress-catalog
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: catalog
    ports:
      - "8082:8082"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy

  notify:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.jvm
      args:
        MODULE_DIR: ms-rutaexpress-notify
        JAVA_VERSION: "17"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: notify
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rutaexpress}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rutaexpress}
    ports:
      - "8083:8083"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  report:
    build:
      context: ../ms-rutaexpress-report
    environment:
      <<: *spring-env
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - rutaexpress-net
    depends_on:
      kafka:
        condition: service_healthy

  audit:
    build:
      context: ../ms-rutaexpress-audit
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: audit
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8085:8085"
    networks:
      - rutaexpress-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bff:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.jvm
      args:
        MODULE_DIR: ms-rutaexpress-bff
        JAVA_VERSION: "21"
    environment:
      SHIPMENTS_URL: http://shipments:8081
      CATALOG_URL: http://catalog:8082
      NOTIFY_URL: http://notify:8083
      REPORT_URL: http://report:8084
      AUDIT_URL: http://audit:8085
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - rutaexpress-net

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        MODULE_DIR: frontend-rutaexpress
        VITE_TENANT_ID: ${VITE_TENANT_ID:-}
        VITE_SPA_CLIENT_ID: ${VITE_SPA_CLIENT_ID:-}
        VITE_API_SCOPE: ${VITE_API_SCOPE:-api://rutaexpress/access_as_user}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    networks:
      - rutaexpress-net
    depends_on:
      - bff
